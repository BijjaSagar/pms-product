<!doctype html>
<html lang="en" data-preset="crimson">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TriponX — premium hotel property management system" />
    <title>TriponX · Hotel PMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var preset = localStorage.getItem('pms-theme-preset') || 'crimson';
          var valid = ['crimson', 'ocean', 'beige', 'sage', 'slate', 'eucalyptus', 'olive', 'lavender', 'midnight'];
          if (valid.indexOf(preset) === -1) preset = 'crimson';
          var root = document.documentElement;
          root.dataset.preset = preset;
          root.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
